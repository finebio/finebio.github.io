<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>화인 찰칵!: 화인바이오 시험포 데이터 공유</title>
<link rel="icon" href="icons/icon_dealer_192.png">
<link rel="apple-touch-icon" href="icons/icon_dealer_192.png">
<style>
  html, body { margin:0; height:100%; background:#f3f7f4; font-family:"Noto Sans KR", -apple-system, "Malgun Gothic", sans-serif; color:#1d3a2b; }
  iframe { border:0; width:100%; height:100%; display:block; }
  .msg { padding:40px 24px; max-width:520px; margin:0 auto; font-size:17px; line-height:1.7; }
  .msg h1 { font-size:22px; margin:0 0 12px; color:#2e7d4f; }
  .msg a.btn { display:inline-block; margin-top:14px; padding:12px 20px; background:#2e7d4f; color:#fff; border-radius:10px; text-decoration:none; font-weight:700; }
  .msg code { background:#e6f2ea; padding:2px 6px; border-radius:6px; font-size:15px; word-break:break-all; }
</style></head>
<body>
<script>
// 총판 앱 감싸기: 구글 Apps Script 주소를 iframe에 넣어 상단 "Google Apps Script 사용자가 만들었습니다" 띠를 가린다.
// 사용: https://finebio.github.io/?t=<총판 토큰>  (토큰은 그대로 앱에 전달)
var APP = 'https://script.google.com/macros/s/AKfycbwpgHkhAuLlDfr6HjX6xIESaEJdQHGH4taLsJRlutk92kJifaNETiAUaUvsjFF8F9Wxwg/exec';
var q = location.search || '';
var ua = navigator.userAgent || '';
var inApp = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(ua);
if (inApp) {
  var here = location.href;
  var kakao = /KAKAOTALK/i.test(ua) ? 'kakaotalk://web/openExternal?url=' + encodeURIComponent(here) : here;
  document.write('<div class="msg"><h1>화인 찰칵!: 화인바이오 시험포 데이터 공유</h1>카카오톡 같은 앱 안의 브라우저에서는 사진 올리기가 되지 않을 수 있습니다.<br>아래 버튼으로 <b>크롬·사파리</b>에서 열어 주세요.' +
    '<br><a class="btn" href="' + kakao + '">브라우저에서 열기</a><p style="font-size:14px;color:#4f5f56">열리지 않으면 오른쪽 위 메뉴(⋮ 또는 공유)에서 "다른 브라우저로 열기"를 누르세요.</p></div>');
} else if (!/[?&]t=/.test(q)) {
  document.write('<div class="msg"><h1>화인 찰칵!: 화인바이오 시험포 데이터 공유</h1>접속 주소에 총판 번호가 없습니다. 본사에서 받은 주소로 다시 열어 주세요.</div>');
} else {
  document.write('<iframe src="' + APP + q + '" allow="camera; microphone; geolocation; web-share; clipboard-write" title="화인 찰칵!: 화인바이오 시험포 데이터 공유"></iframe>');
}
</script>
</body></html>
