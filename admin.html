<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>화인바이오 본사</title>
<link rel="icon" href="icons/icon_admin_192.png">
<link rel="apple-touch-icon" href="icons/icon_admin_192.png">
<style>
  html, body { margin:0; height:100%; background:#f3f7f4; font-family:"Noto Sans KR", -apple-system, "Malgun Gothic", sans-serif; color:#1d3a2b; }
  iframe { border:0; width:100%; height:100%; display:block; }
  .msg { padding:40px 24px; max-width:520px; margin:0 auto; font-size:17px; line-height:1.7; }
  .msg h1 { font-size:22px; margin:0 0 12px; color:#2e7d4f; }
  .msg a.btn { display:inline-block; margin-top:14px; padding:12px 20px; background:#2e7d4f; color:#fff; border-radius:10px; text-decoration:none; font-weight:700; }
  .msg code { background:#e6f2ea; padding:2px 6px; border-radius:6px; font-size:15px; word-break:break-all; }
</style></head>
<body>
<script>
// 본사 앱 감싸기: 구글 Apps Script 주소를 iframe에 넣어 상단 "Google Apps Script 사용자가 만들었습니다" 띠를 가린다.
// 사용: https://finebio.github.io/admin.html?admin=1&k=<개인 링크 키>
// 로그인 없이 열리는 배포(총판과 같은 배포)를 감싼다. 본사 배포(구글 로그인 필요)는 iframe 안에서 로그인 정보가 넘어가지 않아 401이 난다 (0021에서 확인).
// 그래서 이 페이지는 개인 링크 키(k)로만 연다 — 키 확인은 로그인과 상관없다 (AdminUser.gs). 소유자는 본사 배포 주소를 직접 연다
var APP = 'https://script.google.com/macros/s/AKfycbwpgHkhAuLlDfr6HjX6xIESaEJdQHGH4taLsJRlutk92kJifaNETiAUaUvsjFF8F9Wxwg/exec';
var q = location.search || '';
var ua = navigator.userAgent || '';
var inApp = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\//i.test(ua);
if (inApp) {
  var here = location.href;
  var kakao = /KAKAOTALK/i.test(ua) ? 'kakaotalk://web/openExternal?url=' + encodeURIComponent(here) : here;
  document.write('<div class="msg"><h1>화인바이오 본사</h1>카카오톡 같은 앱 안의 브라우저에서는 사진 올리기가 되지 않을 수 있습니다.<br>아래 버튼으로 <b>크롬·사파리</b>에서 열어 주세요.' +
    '<br><a class="btn" href="' + kakao + '">브라우저에서 열기</a><p style="font-size:14px;color:#4f5f56">열리지 않으면 오른쪽 위 메뉴(⋮ 또는 공유)에서 "다른 브라우저로 열기"를 누르세요.</p></div>');
} else if (!/[?&]k=/.test(q)) {
  document.write('<div class="msg"><h1>화인바이오 본사</h1>개인 링크로 열어 주세요. 링크는 대표님(관리자)이 본사 화면 → 설정 → 본사 사용자에서 보내 드립니다.</div>');
} else {
  if (!/[?&]admin=/.test(q)) q = (q ? q + '&' : '?') + 'admin=1';
  document.write('<iframe src="' + APP + q + '" allow="camera; microphone; geolocation; web-share; clipboard-write" title="화인바이오 본사"></iframe>');
}
</script>
</body></html>
